schema_version: '1.1'
registry:
  document_id: VEP-DOC-REGISTRY
  title: 文書台帳
  status: active
  canonical: true
  canonical_for: document-registry
  owners:
  - Xpotato1024
metadata_policy:
  provenance_source: git
  review_source: pull-request
  default_change_control: pull-request
rules:
  unique_document_id: true
  unique_canonical_for: true
  front_matter_projection_must_match_registry: true
  registry_only_forbids_front_matter: true
  historical_documents_are_not_authoritative: true
  allowed_metadata_modes:
  - front-matter
  - registry-only
  - non-markdown
  front_matter_projection_fields:
  - document_id
  - document_type
  - status
  - canonical
  - canonical_for
  - owners
