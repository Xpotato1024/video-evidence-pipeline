name: Bootstrap CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.0"
  PYTHON_VERSION: "3.12"

jobs:
  bootstrap-quality:
    name: bootstrap-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install "${{ env.PYTHON_VERSION }}"
      - run: uv lock
      - run: uv sync --locked --all-groups
      - run: uv run ruff format scripts tests
      - run: uv run ruff check scripts tests
      - run: uv run pytest -q
      - run: uv run python scripts/validate_repository.py --root .
      - name: Commit generated lock and formatting
        run: |
          if git diff --quiet -- uv.lock scripts tests; then
            echo "No bootstrap changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock scripts tests
          git commit -m "chore: lock dependencies and apply formatting"
          git push
