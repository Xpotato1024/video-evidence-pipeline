name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.0"
  PYTHON_VERSION: "3.12"

jobs:
  installation:
    name: installation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install "${{ env.PYTHON_VERSION }}"
      - run: uv sync --locked --no-dev
      - run: uv run --no-sync vep doctor --json
      - name: Build and install complete source bundle
        run: |
          uv run --no-sync python scripts/build_source_bundle.py --output dist
          $record = Get-Content dist/source-bundle.json -Raw | ConvertFrom-Json
          Expand-Archive -LiteralPath (Join-Path dist $record.archive) -DestinationPath .local/bundle
          $bundle = (Get-ChildItem .local/bundle -Directory | Select-Object -First 1).FullName
          uv sync --locked --no-dev --project "$bundle"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-sync --project "$bundle" vep doctor --repository-root "$bundle" --json

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install "${{ env.PYTHON_VERSION }}"
      - run: uv sync --locked
      - name: Verify host dependency boundary
        run: >-
          uv run --no-sync python -c "import importlib.util;
          assert importlib.util.find_spec('faster_whisper') is None;
          assert importlib.util.find_spec('ctranslate2') is None;
          assert importlib.util.find_spec('huggingface_hub') is None"
      - run: uv run ruff check src scripts tests
      - run: uv run ruff format --check src scripts tests

  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install "${{ env.PYTHON_VERSION }}"
      - run: uv sync --locked
      - name: Verify host dependency boundary
        run: >-
          uv run --no-sync python -c "import importlib.util;
          assert importlib.util.find_spec('faster_whisper') is None;
          assert importlib.util.find_spec('ctranslate2') is None;
          assert importlib.util.find_spec('huggingface_hub') is None"
      - name: Install system FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Verify system FFmpeg capabilities
        run: >-
          uv run python -c "from video_evidence_pipeline.media.runner import FFmpegRunner;
          ffmpeg, ffprobe = FFmpegRunner().discover_identities(timeout_seconds=30,
          output_limit_bytes=4194304); print(ffmpeg.version); print(ffprobe.version);
          print(','.join(ffmpeg.capabilities))"
      - name: Run required full synthetic pipeline E2E
        run: uv run pytest -q tests/test_full_e2e.py
        env:
          VEP_REQUIRE_FFMPEG_TESTS: "1"
      - run: uv run pytest -q
        env:
          VEP_REQUIRE_FFMPEG_TESTS: "1"
      - run: uv run vep schema check

  repository-validation:
    name: repository-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install "${{ env.PYTHON_VERSION }}"
      - run: uv sync --locked
      - name: Verify host dependency boundary
        run: >-
          uv run --no-sync python -c "import importlib.util;
          assert importlib.util.find_spec('faster_whisper') is None;
          assert importlib.util.find_spec('ctranslate2') is None;
          assert importlib.util.find_spec('huggingface_hub') is None"
      - run: uv run python scripts/validate_repository.py --root .

  asr-container-build:
    name: asr-container-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install "${{ env.PYTHON_VERSION }}"
      - run: uv sync --locked --no-dev
      - name: Verify host dependency boundary
        run: >-
          uv run --no-sync python -c "import importlib.util;
          assert importlib.util.find_spec('faster_whisper') is None;
          assert importlib.util.find_spec('ctranslate2') is None;
          assert importlib.util.find_spec('huggingface_hub') is None"
      - name: Build pinned ASR image
        run: uv run --no-sync vep asr image-build --repository-root . --json
      - name: Validate ASR runtime and managed lifecycle contract
        run: uv run --no-sync vep asr image-smoke --repository-root . --json
