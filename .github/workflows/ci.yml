name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.0"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install "${{ env.PYTHON_VERSION }}"
      - run: uv sync --locked --all-groups
      - run: uv run ruff check src scripts tests
      - run: uv run ruff format --check src scripts tests

  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install "${{ env.PYTHON_VERSION }}"
      - run: uv sync --locked --all-groups
      - name: Install system FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Verify system FFmpeg capabilities
        run: >-
          uv run python -c "from video_evidence_pipeline.media.runner import FFmpegRunner;
          ffmpeg, ffprobe = FFmpegRunner().discover_identities(timeout_seconds=30,
          output_limit_bytes=4194304); print(ffmpeg.version); print(ffprobe.version);
          print(','.join(ffmpeg.capabilities))"
      - run: uv run pytest -q
        env:
          VEP_REQUIRE_FFMPEG_TESTS: "1"
      - run: uv run vep schema check

  repository-validation:
    name: repository-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install "${{ env.PYTHON_VERSION }}"
      - run: uv sync --locked --all-groups
      - run: uv run python scripts/validate_repository.py --root .
