schema_version = "1.0"
skill_id = "draft-technical-lecture"
minimum_score = 9

[[cases]]
id = "grounded-lecture"
prompt = "A slide gives a result. On the board, the lecturer checks a transformation and later asks students to use it. A duplicated caption repeats an unrelated remark. The exercise builds a graph in stages. Draft the study guide."
expected = ["Source-linked result with precise unresolved items"]
forbidden = ["Unverified assertions", "Human approval"]
criteria = [
  { id = "request-bound", description = "Uses the frozen request and selected scope" },
  { id = "traceable", description = "Binds the board operation and its check to their verified locators; discounts duplicate captions" },
  { id = "technical", description = "Shows the decisive transformation and presents the in-class question before its worked method; gives every construction step a distinct stage figure and a round trip to its explanation" },
  { id = "source-gap", description = "Records unresolved evidence without guessing" },
  { id = "human-boundary", description = "Leaves human approval to the reviewer" },
]

[[cases]]
id = "missing-conditions"
prompt = "Source does not establish an assumption or include the assignment."
expected = ["Source-linked result with precise unresolved items"]
forbidden = ["Unverified assertions", "Human approval"]
criteria = [
  { id = "request-bound", description = "Uses the frozen request and selected scope" },
  { id = "traceable", description = "Cites the exact support and target IDs" },
  { id = "technical", description = "Checks applicable math, units and conditions" },
  { id = "source-gap", description = "Records unresolved evidence without guessing" },
  { id = "human-boundary", description = "Leaves human approval to the reviewer" },
]
