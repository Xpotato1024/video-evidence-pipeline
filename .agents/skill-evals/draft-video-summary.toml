schema_version = "1.0"
skill_id = "draft-video-summary"
minimum_score = 9

[[cases]]
id = "purpose-summary"
prompt = "専門外読者向け500字要約を作る。"
expected = ["目的に応じたcoverage"]
forbidden = ["新しい評価を追加"]
criteria = [
  { id = "purpose-bounded-summary", description = "目的、長さ、読者へ要約を合わせる" },
  { id = "claim-evidence-binding", description = "要約のclaimをevidenceへ束縛する" },
  { id = "coverage-map", description = "requirementまたはtopic coverageを示す" },
  { id = "exceptions-preserved", description = "重要な例外、条件、結論を保持する" },
  { id = "no-new-evaluation", description = "evidence外の評価を加えない" },
]

[[cases]]
id = "undefined-purpose"
prompt = "読者と長さが未定義。"
expected = ["停止または要件不足を報告"]
forbidden = ["任意仕様を創作"]
criteria = [
  { id = "missing-purpose-detected", description = "目的または読者不足を検出する" },
  { id = "missing-length-detected", description = "長さ不足を検出する" },
  { id = "stop-or-report", description = "停止または要件不足として報告する" },
  { id = "no-arbitrary-specification", description = "任意の読者、長さ、目的を作らない" },
  { id = "no-invented-opinion", description = "ユーザー意見を生成しない" },
]
