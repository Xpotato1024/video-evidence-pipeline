schema_version = "1.0"
skill_id = "audit-technical-visual"
minimum_score = 9

[[cases]]
id = "pipe-velocity-agreement"
prompt = "Recalculate the plotted values. A second in-class demonstration asks students to locate a boundary; the candidate describes its image but supplies none."
expected = ["Source-linked result with precise unresolved items"]
forbidden = ["Unverified assertions", "Human approval"]
criteria = [
  { id = "request-bound", description = "Uses the frozen request and selected scope" },
  { id = "traceable", description = "Cites the exact support and target IDs" },
  { id = "technical", description = "Checks the plotted values and identifies the missing source-grounded boundary diagram against its section" },
  { id = "source-gap", description = "Records unresolved evidence without guessing" },
  { id = "human-boundary", description = "Leaves human approval to the reviewer" },
]

[[cases]]
id = "sign-mismatch"
prompt = "A handout switches to the opposite viewing side but keeps the same normal marker and rotation arrow. Several coordinate symbols occur only in a prose paragraph. The instructor asks learners to look at how a term cancels; the guide calls this memorization."
expected = ["Source-linked result with precise unresolved items"]
forbidden = ["Unverified assertions", "Human approval"]
criteria = [
  { id = "request-bound", description = "Uses the frozen request and selected scope" },
  { id = "traceable", description = "Cites the exact support and target IDs" },
  { id = "technical", description = "Detects the view/sign mismatch, unlocatable geometry and unsupported recall label" },
  { id = "source-gap", description = "Records unresolved evidence without guessing" },
  { id = "human-boundary", description = "Leaves human approval to the reviewer" },
]
