[project]
name = "video-evidence-pipeline"
version = "0.0.0"
description = "Repository governance and validation foundation for a video evidence pipeline"
requires-python = ">=3.12,<3.14"
dependencies = [
  "PyYAML>=6.0.2,<7",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".local", "docs/historical"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
