[project]
name = "video-evidence-pipeline"
version = "0.1.0"
description = "Auditable local pipeline contracts for authorized video evidence processing"
requires-python = ">=3.12,<3.14"
dependencies = [
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0.2,<7",
  "typer>=0.16,<1",
  "yt-dlp==2026.8.19",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project.scripts]
vep = "video_evidence_pipeline.cli:app"

[dependency-groups]
dev = [
  "pytest>=9.1.1,<10",
  "ruff>=0.16.3,<1",
]
asr-container = [
  "faster-whisper==1.2.1",
  "hatchling==1.32.4",
  "huggingface-hub==2.2.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".local", "docs/historical"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
