[package]
name = "vep-setup"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "AGPL-3.0-only"

[features]
fault-injection = []

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
